apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-multi-branch
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-multi-branch
  template:
    metadata:
      labels:
        app: kubernetes-multi-branch
    spec:
      containers:
      - name: kubernetes-multi-branch
        image: REPLACE_DOCKER_REPO:prod
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-multi-branch
  namespace: prod
spec:
  selector:
    app: kubernetes-multi-branch
  ports:
  - port: 80
    targetPort: 3000
